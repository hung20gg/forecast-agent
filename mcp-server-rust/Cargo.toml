[package]
name = "financial-mcp-server"
version = "0.1.0"
edition = "2021"
description = "MCP Server for Financial Data Analysis using BigQuery"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "io-std"] }

# HTTP client for BigQuery API
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JSON Schema for tool parameters
schemars = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Environment configuration
dotenvy = "0.15"

# Google Cloud authentication
gcp_auth = "0.12"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Async utilities
futures = "0.3"

# Async trait support
async-trait = "0.1"

# HTTP server for SSE transport
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1.0", features = ["v4"] }
async-stream = "0.3"

[[bin]]
name = "financial-mcp-server"
path = "src/main.rs"
