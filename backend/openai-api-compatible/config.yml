# Model mapping configuration
# Format: "alias:base_model" -> strategy_type
# Example: "react:gpt-4" will use ReAct strategy with GPT-4

models:
  react:
    strategy: "react"
    description: "ReAct agent strategy for reasoning and acting"
  
  researcher:
    strategy: "researcher"
    description: "Researcher agent strategy for information gathering. Sub-agent of Open-Deep-Research"

  open-deep-research:
    strategy: "open-deep-research"
    description: "Deep research strategy for comprehensive analysis"

# Default base models if not specified
default_models:
  - "gpt-4.1-mini"
  - "gpt-5-mini"

# Server configuration
server:
  host: "0.0.0.0"
  port: 8000
  api_key: null  # Set to require API key authentication, null for no auth
