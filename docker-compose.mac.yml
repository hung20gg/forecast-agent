version: '3.8'

# macOS-specific overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.mac.yml --profile <full|mcp-only> up
# Note: text-embedding-service should run locally on macOS (not in Docker)

services:
  mcp-server:
    ports:
      - "${MCP_SERVER_PORT:-9003}:9003"
    environment:
      - EMBEDDING_URL=${EMBEDDING_URL:-http://host.docker.internal:8080/embed}

  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  qdrant:
    ports:
      - "6333:6333"

  # Disable text-embedding-service on macOS - run it locally instead
  text-embedding-service:
    image: hello-world:latest
    profiles:
      - never-start
    deploy:
      replicas: 0
