version: '3.8'

services:
  mcp-server:
    profiles: ["full", "mcp-only"]
    image: quanghung20gg/forecast-mcp-server:v0.2
    container_name: forecast-agent-mcp-server
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/keys/bigquery.json
      - LIMIT_TIME=${LIMIT_TIME}
      - MCP_SERVER_HOST=${MCP_SERVER_HOST:-0.0.0.0}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-9003}
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_URL=http://text-embedding-service:80/embed
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "${MCP_SERVER_PORT:-9003}:9003"
    networks:
      - forecast-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\", 9003)); s.close()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    profiles: ["full"]
    image: quanghung20gg/forecast-backend:v0.1
    container_name: forecast-agent-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MCP_SERVER_URL=http://mcp-server:9003/sse
      - BACKEND_HOST=${BACKEND_HOST:-0.0.0.0}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
    networks:
      - forecast-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    profiles: ["full"]
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: forecast-agent-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      - OFFLINE_MODE=${OFFLINE_MODE:-true}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - OPENAI_API_BASE_URL=http://backend:8000/v1
      - OPENAI_API_KEY=${BACKEND_API_KEY:-dummy-key}
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - forecast-agent-network

  text-embedding-service:
    profiles: ["full", "mcp-only"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: forecast-agent-embedding
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./data:/data
    command: --model-id ${EMBEDDING_MODEL_ID:-google/embeddinggemma-300m}
    networks:
      - forecast-agent-network

  qdrant:
    profiles: ["full", "mcp-only", "vectordb-init"]
    image: qdrant/qdrant:v1.16.3
    container_name: forecast-agent-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    ports:
      - "6333:6333"
    networks:
      - forecast-agent-network
    restart: unless-stopped

  vectordb-init:
    profiles: ["vectordb-init"]
    image: quanghung20gg/forecast-vectordb-init:v0.1
    container_name: forecast-agent-vectordb-init
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - COLLECTION_NAME=${COLLECTION_NAME}
      - GCS_CREDENTIALS_PATH=/app/keys/bigquery.json
      - ALLOW_VECTORDB_RESET=true
    volumes:
      - ./mcp-server/keys:/app/keys:ro
      - qdrant-snapshots:/qdrant/snapshots
    networks:
      - forecast-agent-network
    restart: "no"

networks:
  forecast-agent-network:
    driver: bridge

volumes:
  open-webui-data:
  qdrant-data:
  qdrant-snapshots: