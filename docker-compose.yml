  # MCP Server (Rust) - High-Performance Financial Data Analysis Tools
  mcp-server-rust:
    build:
      context: ./mcp-server-rust
      dockerfile: Dockerfile
    container_name: forecast-agent-mcp-server-rust
    ports:
      - "${MCP_SERVER_PORT:-9003}:9003"
    environment:
      - RUST_LOG=info
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/keys/bigquery.json
      - LIMIT_TIME=${LIMIT_TIME}
    volumes:
      - ./mcp-server-rust/keys:/app/keys:ro
    networks:
      - forecast-agent-network
    restart: unless-stopped
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "9003"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Backend API - OpenAI Compatible Agent Server
  backend:
    build:
      context: .
      dockerfile: backend/openai-api-compatible/Dockerfile
      args:
        - LLM_REPO_URL=${LLM_REPO_URL:-}
    container_name: forecast-agent-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MCP_SERVER_URL=http://mcp-server-rust:9003/sse
      - BACKEND_HOST=${BACKEND_HOST:-0.0.0.0}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      # Database configs (optional)

    volumes:
      - ./backend/openai-api-compatible:/app/backend/openai-api-compatible
      - ./agent:/app/agent
    depends_on:
      mcp-server-rust:
        condition: service_healthy
    networks:
      - forecast-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - Open WebUI
  frontend:
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: forecast-agent-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      - OFFLINE_MODE=${OFFLINE_MODE:-true}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - OPENAI_API_BASE_URL=http://backend:8000/v1
      - OPENAI_API_KEY=${BACKEND_API_KEY:-dummy-key}
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - forecast-agent-network
    restart: unless-stopped

networks:
  forecast-agent-network:
    driver: bridge

volumes:
  open-webui-data:
